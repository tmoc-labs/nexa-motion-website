<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nexa Motion — site versions</title>
<style>
:root{--bg:#F3EFE6;--card:#FBFAF7;--ink:#14201C;--muted:#5F6E66;--line:#D9D2C2}
@media (prefers-color-scheme: dark){
  :root{--bg:#14201C;--card:#1B2925;--ink:#F3EFE6;--muted:#9AA7A0;--line:#2C3B36}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
main{max-width:1120px;margin:0 auto;padding:56px 24px 80px}
h1{margin:0 0 6px;font-size:28px;font-weight:600;letter-spacing:-0.02em}
.lede{margin:0 0 36px;color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px;list-style:none;margin:0;padding:0}
.card{display:block;height:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s,box-shadow .15s}
.card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.14)}
.thumb{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--line)}
.body{padding:16px 18px 18px}
.title{margin:0 0 4px;font-size:17px;font-weight:600}
.note{margin:0;color:var(--muted);font-size:14px}
.meta{margin:12px 0 0;color:var(--muted);font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em}
.empty{color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Nexa Motion — site versions</h1>
<p class="lede">Design prototypes of the site. Pick one to open it.</p>
<ul class="grid" id="versions"></ul>
</main>
<script>
// Versions are listed in versions.json; each lives in versions/<slug>/.
fetch('versions.json')
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function (versions) {
    var list = document.getElementById('versions');
    if (!versions.length) { list.outerHTML = '<p class="empty">No versions yet.</p>'; return; }
    versions.forEach(function (v) {
      var base = 'versions/' + encodeURIComponent(v.slug) + '/';
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.className = 'card';
      a.href = base;
      if (v.thumbnail) {
        var img = document.createElement('img');
        img.className = 'thumb';
        img.src = base + v.thumbnail;
        img.alt = '';
        img.loading = 'lazy';
        a.appendChild(img);
      }
      var body = document.createElement('div');
      body.className = 'body';
      [['title', v.title], ['note', v.note], ['meta', v.added && 'ADDED ' + v.added]].forEach(function (f) {
        if (!f[1]) return;
        var p = document.createElement('p');
        p.className = f[0];
        p.textContent = f[1];
        body.appendChild(p);
      });
      a.appendChild(body);
      li.appendChild(a);
      list.appendChild(li);
    });
  })
  .catch(function () {
    document.getElementById('versions').outerHTML = '<p class="empty">Could not load versions.json.</p>';
  });
</script>
</body>
</html>
